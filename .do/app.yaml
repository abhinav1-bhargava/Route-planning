# DigitalOcean App Platform spec for the route-planning demo.
#
# Region blr (Bangalore) puts the runtime closest to the simulated
# Gurugram fleet so Google Distance Matrix latency stays low.
#
# Two services share one app domain:
#   - api        — FastAPI + agents + Telegram long-polling
#                  routed at /api/* (prefix stripped) and /ws/* (kept)
#   - dashboard  — Next.js, routed at /
#
# Redis is provisioned as a managed dev DB and bound to the api service
# via ${redis.DATABASE_URL}. SQLite is ephemeral on App Platform — the
# api start command runs scripts/reset_demo.py before uvicorn so each
# container boot has a fresh seed.

name: route-planning
region: blr

services:
  - name: api
    github:
      repo: abhinav1-bhargava/Route-planning
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: python
    build_command: pip install -r requirements.txt
    # Seed the SQLite DB on every cold start (the App Platform filesystem
    # is ephemeral) then bring up uvicorn on the platform-assigned port.
    run_command: |
      python scripts/reset_demo.py
      python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT
    instance_size_slug: basic-xxs
    instance_count: 1
    routes:
      # /api/* gets the prefix stripped so FastAPI sees /workers,
      # /tasks, /routes, /events, /reset, /scenario, /wfm-payload,
      # and the TEST_MODE-only /test/* endpoints — all unchanged from
      # the local dev contract.
      - path: /api
        preserve_path_prefix: false
      # /ws/events stays as-is — the prefix is preserved so FastAPI's
      # @router.websocket("/ws/events") matches.
      - path: /ws
        preserve_path_prefix: true
    envs:
      - key: ANTHROPIC_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: GOOGLE_MAPS_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: TELEGRAM_BOT_TOKEN
        type: SECRET
        scope: RUN_TIME
      - key: TELEGRAM_CUSTOMER_CHAT_ID
        type: SECRET
        scope: RUN_TIME
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.DATABASE_URL}
      - key: DATABASE_URL
        scope: RUN_TIME
        value: sqlite:///./demo.db
      - key: EVENT_BUS
        scope: RUN_TIME
        value: asyncio
      - key: ALPHA_DEFAULT
        scope: RUN_TIME
        value: "0.7"
      - key: PYTHONUNBUFFERED
        scope: RUN_TIME
        value: "1"

  - name: dashboard
    github:
      repo: abhinav1-bhargava/Route-planning
      branch: main
      deploy_on_push: true
    source_dir: /dashboard
    environment_slug: node-js
    build_command: npm install && npm run build
    run_command: npm start -- -p $PORT
    instance_size_slug: basic-xxs
    instance_count: 1
    routes:
      - path: /
    envs:
      # The dashboard fetches /workers, /routes, etc. via this base URL.
      # ${APP_URL} expands to the unified app domain at deploy time, so
      # the browser hits e.g. https://route-planning-xyz.ondigitalocean.app/api
      # which the api service receives with the /api prefix stripped.
      - key: NEXT_PUBLIC_API_URL
        scope: BUILD_TIME
        value: ${APP_URL}/api
      # Native WebSocket URL for the live event stream. ${APP_DOMAIN}
      # is the bare hostname so we can prepend wss://.
      - key: NEXT_PUBLIC_WS_URL
        scope: BUILD_TIME
        value: wss://${APP_DOMAIN}/ws/events
      # Maps key needs to be baked into the client bundle at build time
      # — Next.js inlines NEXT_PUBLIC_* vars during `next build`.
      - key: NEXT_PUBLIC_GOOGLE_MAPS_KEY
        type: SECRET
        scope: BUILD_TIME

databases:
  - name: redis
    engine: REDIS
    production: false
